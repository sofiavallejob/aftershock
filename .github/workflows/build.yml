name: Build

# Builds macOS (universal) and Windows (x64) on every push.
# Pushing a tag like v1.0.0 also makes a GitHub release with the installers and the manual.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S plugin -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j 4 --target Aftershock_VST3 Aftershock_AU Aftershock_Standalone aftershock_test aftershock_render
      - name: Test processor
        run: build/aftershock_test_artefacts/Release/aftershock_test
      - name: pluginval
        run: |
          curl -L -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval --strictness-level 7 --validate-in-process --skip-gui-tests build/Aftershock_artefacts/Release/VST3/Aftershock.vst3
      - name: Installer (.pkg) and zip
        run: |
          cp LICENSE installer/LICENSE.txt
          V=$(grep -m1 -E "project\(Aftershock VERSION" plugin/CMakeLists.txt | sed -E 's/.*VERSION ([0-9.]+).*/\1/')
          A=build/Aftershock_artefacts/Release
          mkdir -p pkgroot/vst3 pkgroot/au pkgroot/app dist
          cp -R $A/VST3/Aftershock.vst3 pkgroot/vst3/
          cp -R $A/AU/Aftershock.component pkgroot/au/
          cp -R $A/Standalone/Aftershock.app pkgroot/app/
          pkgbuild --root pkgroot/vst3 --identifier com.sofiavallejo.aftershock.vst3 --version $V --install-location "/Library/Audio/Plug-Ins/VST3" vst3.pkg
          pkgbuild --root pkgroot/au --identifier com.sofiavallejo.aftershock.au --version $V --install-location "/Library/Audio/Plug-Ins/Components" au.pkg
          pkgbuild --root pkgroot/app --identifier com.sofiavallejo.aftershock.app --version $V --install-location "/Applications" app.pkg
          productbuild --distribution installer/macos-distribution.xml --package-path . --resources installer "dist/Aftershock-$V-macOS.pkg"
          (cd pkgroot && zip -qry "../dist/Aftershock-$V-macOS.zip" vst3 au app)
          cp build/aftershock_render_artefacts/Release/aftershock_render dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Aftershock-macOS
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S plugin -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release -j 4 --target Aftershock_VST3 Aftershock_Standalone aftershock_test aftershock_render
      - name: Test processor
        run: build\aftershock_test_artefacts\Release\aftershock_test.exe
      - name: pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pv
          pv\pluginval.exe --strictness-level 7 --validate-in-process --skip-gui-tests "build\Aftershock_artefacts\Release\VST3\Aftershock.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Installer (Inno Setup) and zip
        shell: pwsh
        run: |
          $v = (Select-String -Path plugin\CMakeLists.txt -Pattern 'project\(Aftershock VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$v /DBuildDir="$pwd\build\Aftershock_artefacts\Release" /O"$pwd\dist" installer\windows.iss
          Compress-Archive -Path build\Aftershock_artefacts\Release\VST3\Aftershock.vst3, build\Aftershock_artefacts\Release\Standalone\Aftershock.exe -DestinationPath "dist\Aftershock-$v-Windows.zip"
          Copy-Item build\aftershock_render_artefacts\Release\aftershock_render.exe dist\
      - uses: actions/upload-artifact@v4
        with:
          name: Aftershock-Windows
          path: dist

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            artifacts/Aftershock-macOS/*.pkg
            artifacts/Aftershock-macOS/*.zip
            artifacts/Aftershock-Windows/*.exe
            artifacts/Aftershock-Windows/*.zip
            docs/Aftershock-Manual.pdf
